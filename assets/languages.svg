<svg width="495" height="220" viewBox="0 0 495 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { fill: #A78BFA; font-size: 14px; font-weight: 600; font-family: 'Segoe UI', sans-serif; }
      .lang { fill: #c9d1d9; font-size: 12px; font-family: 'Segoe UI', sans-serif; }
      .pct  { fill: #A78BFA; font-size: 11px; font-weight: 600; font-family: 'Segoe UI', sans-serif; }
    </style>
  </defs>
  <rect width="495" height="220" rx="10" fill="#0d1117" stroke="#7C3AED" stroke-width="1"/>
  <text x="25" y="35" class="title">Most Used Languages</text>
  
  <!-- TypeScript bar -->
  <text x="25" y="65" class="lang">TypeScript</text>
  <rect x="25" y="72" width="330" height="8" rx="4" fill="#1e293b"/>
  <rect x="25" y="72" width="165" height="8" rx="4" fill="#3178C6"/>
  <text x="365" y="80" class="pct">33.4%</text>

  <!-- HTML bar -->
  <text x="25" y="100" class="lang">HTML</text>
  <rect x="25" y="107" width="330" height="8" rx="4" fill="#1e293b"/>
  <rect x="25" y="107" width="151" height="8" rx="4" fill="#e34c26"/>
  <text x="365" y="115" class="pct">30.5%</text>

  <!-- JavaScript bar -->
  <text x="25" y="135" class="lang">JavaScript</text>
  <rect x="25" y="142" width="330" height="8" rx="4" fill="#1e293b"/>
  <rect x="25" y="142" width="86" height="8" rx="4" fill="#f1e05a"/>
  <text x="365" y="150" class="pct">17.3%</text>

  <!-- Python bar -->
  <text x="25" y="170" class="lang">Python</text>
  <rect x="25" y="177" width="330" height="8" rx="4" fill="#1e293b"/>
  <rect x="25" y="177" width="64" height="8" rx="4" fill="#3572A5"/>
  <text x="365" y="185" class="pct">12.8%</text>

  <!-- CSS bar -->
  <text x="25" y="205" class="lang">CSS</text>
  <rect x="25" y="206" width="330" height="8" rx="4" fill="#1e293b"/>
  <rect x="25" y="206" width="24" height="8" rx="4" fill="#563d7c"/>
  <text x="365" y="214" class="pct">4.8%</text>
</svg>