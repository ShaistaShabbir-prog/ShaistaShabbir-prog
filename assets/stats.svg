<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { fill: #A78BFA; font-size: 14px; font-weight: 600; font-family: 'Segoe UI', sans-serif; }
      .stat-label { fill: #c9d1d9; font-size: 12px; font-family: 'Segoe UI', sans-serif; }
      .stat-value { fill: #A78BFA; font-size: 12px; font-weight: 600; font-family: 'Segoe UI', sans-serif; }
      .icon { fill: #7C3AED; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="495" height="195" rx="10" fill="url(#bg)" stroke="#7C3AED" stroke-width="1"/>
  
  <!-- Title -->
  <text x="25" y="35" class="title">Shaista Shabbir's GitHub Stats</text>
  
  <!-- Stars icon + value -->
  <text x="25" y="75" class="stat-label">⭐ Total Stars</text>
  <text x="220" y="75" class="stat-value">17</text>
  
  <!-- Commits -->
  <text x="25" y="105" class="stat-label">📦 Public Repos</text>
  <text x="220" y="105" class="stat-value">16</text>
  
  <!-- Followers -->
  <text x="25" y="135" class="stat-label">👥 Followers</text>
  <text x="220" y="135" class="stat-value">89</text>
  
  <!-- Following -->
  <text x="25" y="165" class="stat-label">👤 Following</text>
  <text x="220" y="165" class="stat-value">94</text>
  
  <!-- Right column -->
  <!-- Python -->
  <text x="260" y="75" class="stat-label">🐍 Python</text>
  <text x="420" y="75" class="stat-value">12.8%</text>
  
  <!-- TypeScript -->
  <text x="260" y="105" class="stat-label">📘 TypeScript</text>
  <text x="420" y="105" class="stat-value">33.4%</text>
  
  <!-- JavaScript -->
  <text x="260" y="135" class="stat-label">🟡 JavaScript</text>
  <text x="420" y="135" class="stat-value">17.3%</text>
  
  <!-- HTML -->
  <text x="260" y="165" class="stat-label">🌐 HTML/CSS</text>
  <text x="420" y="165" class="stat-value">35.3%</text>
</svg>